name: fxmpp
description: A Flutter plugin for XMPP (Extensible Messaging and Presence Protocol) communication, supporting iOS, macOS, Android, and Web platforms.
version: 1.0.2
homepage: https://hainguyen.dev
repository: https://github.com/haithngn/fxmpp

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  xml: ^7.0.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.hainguyen.fxmpp
        pluginClass: FxmppPlugin
      ios:
        pluginClass: FxmppPlugin
      macos:
        pluginClass: FxmppPlugin
      web:
        pluginClass: FxmppWeb
        fileName: src/fxmpp_web.dart

topics:
  - xmpp
  - messaging
  - chat
  - communication
  - real-time
